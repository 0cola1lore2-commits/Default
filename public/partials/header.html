<a class="skip-link" href="#continut">Sari la conținut</a>
<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="/" aria-label="{{shop.name}} — prima pagină">
      <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <circle cx="20" cy="20" r="20" fill="#B8325E"/>
        <path d="M11.5 22.5h17l-2.6 11.2a1.6 1.6 0 0 1-1.56 1.2h-8.58a1.6 1.6 0 0 1-1.56-1.2z" fill="#fff"/>
        <path d="M15.4 22.5l1.2 12M20 22.5v12M24.6 22.5l-1.2 12" stroke="#B8325E" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
        <path d="M10.5 22.5c-.4-4 2.4-6 5.2-6 .2-3.2 2.2-5.4 4.3-5.4s4.1 2.2 4.3 5.4c2.8 0 5.6 2 5.2 6z" fill="#FFE3EA"/>
        <circle cx="20" cy="8.2" r="2.6" fill="#FFD166"/>
      </svg>
      <span class="brand__name">{{shop.name}}</span>
    </a>
    <nav class="nav" id="site-nav" aria-label="Principal">
      <a href="/#produse">Meniu</a>
      <a href="/#comenzi-speciale">Comenzi speciale</a>
      <a href="/#despre">Despre noi</a>
      <a href="/#contact">Contact</a>
      <a class="nav__phone" href="tel:{{shop.phoneHref}}">Sună: {{shop.phone}}</a>
    </nav>
    <div class="site-header__actions">
      <a class="phone-link" href="tel:{{shop.phoneHref}}"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg><span>{{shop.phone}}</span></a>
      <a class="cart-btn" href="/comanda" id="cart-button" aria-label="Coșul tău"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-bag"/></svg><span class="cart-btn__count" id="cart-count" hidden>0</span></a>
      <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Deschide meniul"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>
